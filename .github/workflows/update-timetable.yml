name: Update Timetable

on:
  schedule:
    - cron: '0 2 */3 * *'  # every 3 days at 02:00 UTC
  workflow_dispatch:       # manual trigger

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate timetable
        run: cd timetable-generator && ./update.sh --generate-only

      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          sudo apt-get install -y geckodriver
          cd timetable-generator && xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" ./test/run-ci.sh

      - name: Save test screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-screenshot
          path: timetable-generator/test/screenshot.png
          retention-days: 7

      - name: Check test results
        id: check
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo "Tests failed. Aborting deploy (manual trigger requires passing tests)."
            exit 1
          fi
          echo "Tests passed."

      - name: Deploy to Cloudflare Pages
        if: success() || github.event_name == 'schedule'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: cd timetable-generator && ./update.sh --deploy-only
